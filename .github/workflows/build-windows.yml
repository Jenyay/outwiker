name: Build for Windows

on: [push, workflow_dispatch]

jobs:
  build-windows:
    # Pin the runner image: the virtual environment cache key names it, so the
    # two must not drift apart when the `windows-latest` label moves.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          # Name the runner image in the key so a cache cannot leak between
          # images. Keep it in sync with runs-on.
          key: ${{ runner.os }}-windows-2025-cp314-venv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-windows-2025-cp314-venv-

      - name: Sync dependencies
        run: uv sync --dev --extra gui

      - name: Get OutWiker version
        shell: bash
        run: |
          OUTWIKER_VERSION=$(uv run python -c "import outwiker; print(outwiker.__version_str__)")
          echo "OUTWIKER_VERSION=$OUTWIKER_VERSION" >> $GITHUB_ENV

      - name: Check OutWiker version
        shell: bash
        run: |
          echo "OutWiker version: ${{ env.OUTWIKER_VERSION }}"

      - name: Build unstable OutWiker version
        run: |
          uv run python -m invoke win

      - name: Build stable OutWiker version
        run: |
          uv run python -m invoke win --is-stable

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: outwiker-full-${{ env.OUTWIKER_VERSION }}-windows-x86_64
          path: |
            build/${{ env.OUTWIKER_VERSION }}/windows/*

      - name: Upload artifacts for executable version
        uses: actions/upload-artifact@v7
        with:
          name: outwiker-${{ env.OUTWIKER_VERSION }}-windows-x86_64
          path: |
            build/${{ env.OUTWIKER_VERSION }}/windows/outwiker_exe

      - name: Build plugins
        run: |
          uv run python -m invoke plugins

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v7
        with:
          name: outwiker_plugins_${{ env.OUTWIKER_VERSION }}
          path: |
            build/${{ env.OUTWIKER_VERSION }}/plugins
