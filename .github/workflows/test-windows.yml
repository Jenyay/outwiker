name: Tests on Windows

on: [push, pull_request, workflow_dispatch]

jobs:
  test-windows:
    # Pin the runner image: the virtual environment cache key names it, so the
    # two must not drift apart when the `windows-latest` label moves.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          # Name the runner image in the key so a cache cannot leak between
          # images. Keep it in sync with runs-on.
          key: ${{ runner.os }}-windows-2025-cp314-venv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-windows-2025-cp314-venv-

      - name: Sync dependencies
        run: uv sync --dev --extra gui

      - name: Run tests
        run: uv run inv test

      - name: Coverage report
        run: uv run inv coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage_report
          path: build/htmlcov
