name: Tests on Linux

on: [push, pull_request, workflow_dispatch]

jobs:
  test-linux:
    # Test on the same image the Linux binary is built on (see build-linux.yml):
    # wxPython is compiled from source against the image's glibc, so a virtual
    # environment built on another image may be unusable here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            libssl-dev \
            gettext \
            autopoint \
            autoconf \
            automake \
            libtool \
            pkg-config \
            p7zip-full \
            xvfb \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxtst-dev \
            libgtk-3-0 \
            ibus-gtk3 \
            libglu1-mesa \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libsdl2-dev \
            libnotify-dev \
            freeglut3-dev \
            libhunspell-dev \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            xserver-xorg-core \
            libwebkit2gtk-4.1-0

      - name: Check autopoint
        run: which autopoint && autopoint --version

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          # The key names the runner image: a venv built on another image is
          # linked against another glibc (see build-linux.yml). Keep it in sync
          # with runs-on.
          key: ${{ runner.os }}-ubuntu-24.04-cp314-venv-gui-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-cp314-venv-

      - name: Sync dependencies
        run: uv sync --dev --extra gui

      - name: Verify wxPython
        run: uv pip show wxPython && uv run python -c "import wx; print(wx.VERSION)"

      - name: Run tests
        run: xvfb-run --server-args="-screen 0 1280x1024x24" uv run pytest --pytest-durations-group-by=module
