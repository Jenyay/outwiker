name: Build for Linux

on: [push, workflow_dispatch]

jobs:
  build-linux:
    # Pin Ubuntu 24.04 instead of ubuntu-latest: the produced binary has to run
    # on glibc 2.39+ (Ubuntu 24.04, Debian 13 and newer), while ubuntu-latest
    # now points to Ubuntu 26.04 and would raise that requirement.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            libssl-dev \
            gettext \
            autopoint \
            autoconf \
            automake \
            libtool \
            pkg-config \
            p7zip-full \
            xvfb \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxtst-dev \
            libgtk-3-0 \
            ibus-gtk3 \
            libglu1-mesa \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libsdl2-dev \
            libnotify-dev \
            freeglut3-dev \
            libhunspell-dev \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            xserver-xorg-core \
            libwebkit2gtk-4.1-0

      - name: Check autopoint
        run: which autopoint && autopoint --version

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Cache virtual environment
        uses: actions/cache@v6
        with:
          path: .venv
          # wxPython has no Linux wheels, so it is compiled from source inside the
          # venv and linked against the glibc of the runner image. The key must
          # therefore include the image: a venv built on 26.04 requires
          # GLIBC_2.43 and cannot be imported on 24.04.
          key: ${{ runner.os }}-ubuntu-24.04-cp314-venv-gui-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-cp314-venv-

      - name: Sync dependencies
        run: uv sync --dev --extra gui

      - name: Verify wxPython
        run: uv pip show wxPython && uv run python -c "import wx; print(wx.VERSION)"

      - name: Get OutWiker version
        run: |
          OUTWIKER_VERSION=$(uv run python -c "import outwiker; print(outwiker.__version_str__)")
          echo "OUTWIKER_VERSION=$OUTWIKER_VERSION" >> $GITHUB_ENV

      - name: Check OutWiker version
        run: |
          echo "OutWiker version: ${{ env.OUTWIKER_VERSION }}"

      - name: Build unstable OutWiker version
        run: |
          uv run python -m invoke linux-bin

      - name: Build stable OutWiker version
        run: |
          uv run python -m invoke linux-bin --is-stable

      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        with:
          name: outwiker-full-${{ env.OUTWIKER_VERSION }}-linux-x86_64
          path: |
            build/${{ env.OUTWIKER_VERSION }}/linux/*

      - name: Upload artifacts for executable version
        uses: actions/upload-artifact@v7
        with:
          name: outwiker-${{ env.OUTWIKER_VERSION }}-linux-x86_64
          path: |
            build/${{ env.OUTWIKER_VERSION }}/linux/outwiker_bin

      - name: Build plugins
        run: |
          uv run python -m invoke plugins

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v7
        with:
          name: outwiker_plugins_${{ env.OUTWIKER_VERSION }}
          path: |
            build/${{ env.OUTWIKER_VERSION }}/plugins

  build-snap:
    # Use the same runner image as the main build. The snap itself is built
    # inside the core26 container declared in snapcraft.yaml, so this image only
    # affects the host tooling (snapcraft, LXD).
    runs-on: ubuntu-24.04
    env:
      # Build in an LXD container. Multipass instances are hard-coded to 2 GB of
      # RAM by craft-providers, which is not enough to compile wxPython from
      # source, while LXD instances are not capped and can use the whole runner.
      SNAPCRAFT_BUILD_ENVIRONMENT: lxd
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install and initialize LXD
        run: |
          sudo snap wait system seed.loaded
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd waitready --timeout=300
          # Put the storage pool on the runner filesystem instead of a loop file,
          # because the build needs several gigabytes and the runner has ~14 GB.
          sudo lxd init --auto --storage-backend=dir
          # Docker is preinstalled on the runner image and its iptables rules drop
          # traffic forwarded from the LXD bridge, so the build container would
          # have no internet access. The runner is an ephemeral VM, so accepting
          # forwarded traffic is safe. Canonical's action-build does the same:
          # https://linuxcontainers.org/lxd/docs/master/howto/network_bridge_firewalld/#prevent-issues-with-lxd-and-docker
          sudo iptables -P FORWARD ACCEPT
          # Snapcraft talks to the LXD socket as the current user, so the user has
          # to be in the lxd group. Group changes apply only to new sessions, thus
          # the build step is executed through `sg lxd`.
          sudo usermod -aG lxd "$(id -un)"
          # Fail early instead of after the dependencies are installed.
          sg lxd -c "lxc info > /dev/null"

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Sync dependencies
        run: uv sync --dev

      - name: Get OutWiker version
        run: |
          OUTWIKER_VERSION=$(uv run python -c "import outwiker; print(outwiker.__version_str__)")
          echo "OUTWIKER_VERSION=$OUTWIKER_VERSION" >> $GITHUB_ENV

      - name: Check OutWiker version
        run: |
          echo "OutWiker version: ${{ env.OUTWIKER_VERSION }}"

      - name: Build snap package
        run: |
          # Run with the lxd group, which was only just added to the user, so the
          # current session does not have it yet.
          sg lxd -c "uv run python -m invoke snap"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: outwiker-${{ env.OUTWIKER_VERSION }}-linux-snap
          path: |
            build/${{ env.OUTWIKER_VERSION }}/linux/*.snap
          if-no-files-found: error
