[project]
name = "outwiker"
description = "A cross-platform software for keeping your notes in a tree"
authors = [
{name = "Eugene Ilin (aka Jenyay)", email = "jenyay.ilin@gmail.com"},
]
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["outliner", "notepad", "notes", "wiki"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "Pillow==10.4.0",
    "idna==3.20",
    "pyparsing==3.2.5",
    "psutil==7.2.2",
    "rcssmin==1.2.2",
    "attrdict3==2.0.2",
    "chunspell==2.0.5",
    "six==1.17.0",
]
classifiers=[
    "Development Status :: 3 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Natural Language :: Ukrainian",
    "Natural Language :: Swedish",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Office/Business",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup",
    ]

    dynamic = ["version"]

[project.urls]
Homepage = "https://jenyay.net/Outwiker/English"
Documentation = "https://outwiker.readthedocs.io/"
Repository = "https://github.com/Jenyay/outwiker"

[project.optional-dependencies]
gui = [ 
    "wxPython==4.3.1",
]

[project.scripts]
outwiker = "outwiker.__main__:main"

[dependency-groups]
dev = [
    "invoke==3.0.3",
    "cx-freeze==7.2.10",
    "pympler==1.1",
    "pytest==8.3.5",
    "coverage==7.16.2",
    "jinja2==3.1.6",
    "colorama==0.4.6",
    "sphinx==7.1.2",
    "line-profiler==5.0.2",
    "owbuildtools",
]


[tool.uv]
default-groups = ["dev"]
#no-binary-package = ["wxPython"]

[tool.uv.sources]
wxPython = [
    { url = "https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.3.1/wxpython-4.3.1+ubuntu2404-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.12.*'" },
    { url = "https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.3.1/wxpython-4.3.1+ubuntu2404-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux' and python_version == '3.13.*'" },
]
owbuildtools = { path = "./owbuildtools", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["outwiker.tests*"]

[tool.setuptools.package-data]
outwiker = ["data/**/*"]

[tool.setuptools.exclude-package-data]
outwiker = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "outwiker.__version_str__"}

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"
